# Sicherheits-Header für ALLE Vhosts (Admin, Mandanten-Hosts, Mock-Hosts, künftige).
#
# WO: http-Ebene — eingebunden EINMAL in nginx.conf. Damit erbt jeder Server-Block
# sie, auch später hinzugefügte. Kein Server-Block definiert eigene add_header-Zeilen:
# nginx vererbt add_header nur nach unten (http → server → location), und ein EINZIGES
# add_header in einem unteren Block lässt ALLE geerbten Header stillschweigend
# verschwinden (klassische nginx-Falle).
#
# 'always': Header auch auf 4xx/5xx (404-Fallback, limit_req 429, Proxy-Fehler).
#
# Upstream-Seite: kc-proxy.conf versteckt (proxy_hide_header) Keycloaks eigene Werte
# dieser Header — add_header ERGÄNZT, ersetzt nicht; ohne hide gäbe es doppelte oder
# konfligierende Werte (z. B. SAMEORIGIN von Keycloak + DENY vom Proxy).
#
# Bewusst NICHT gesetzt:
#   - Content-Security-Policy    → Keycloak setzt sie selbst (Admin-Console und
#                                  Login-Themes brauchen ihre script-src-Allowlist).
#                                  Eine eigene Proxy-CSP würde beides brechen.
#   - Cross-Origin-Opener-Policy → würde keycloak-js-Popup-Logins brechen
#                                  (window.opener über Origins hinweg).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options            "DENY" always;
add_header Referrer-Policy            "no-referrer" always;
# publickey-credentials-get=(self): WebAuthn/Passkey bleibt im Top-Level-Dokument
# (Keycloak-Login-Seite) erlaubt, in fremden iframes verboten.
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(), usb=(), publickey-credentials-get=(self)" always;

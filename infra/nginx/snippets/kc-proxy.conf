# Keycloak-Upstream (Reverse Proxy → Keycloak). Nginx ist der erste Proxy im Internet.
#
# Alle Forwarding-Header werden NEU gesetzt bzw. geleert, nie aus dem Client übernommen.
# $proxy_add_x_forwarded_for wird bewusst NICHT verwendet: es hängt Client-Werte an.
# Keycloak liest nur 'Forwarded' (KC_PROXY_HEADERS=forwarded) und nur von
# KC_PROXY_TRUSTED_ADDRESSES (172.30.0.10/32).
#
# ÖFFENTLICHER PORT: '$kc_public_port' MUSS im umgebenden server-Block gesetzt sein:
#   - Mandanten-Vhosts:  set $kc_public_port 8443;  (Container 443 → Host 8443)
#   - Admin-Vhost:       set $kc_public_port 8444;  (Container 8444 → Host 8444)
# Ohne die Variable startet nginx nicht ("unknown variable") — das ist gewollt (fail-fast),
# damit kein Vhost versehentlich den falschen Port an Keycloak meldet.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host               $http_host;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-Host   $http_host;
# RFC 7239: 'host' enthält bereits host:port aus dem Client-Request ($http_host).
# X-Forwarded-Port ist für Keycloak (KC_PROXY_HEADERS=forwarded) irrelevant, wird aber
# konsistent gesetzt, falls jemand später auf xforwarded umstellt.
proxy_set_header X-Forwarded-Port   $kc_public_port;
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header Forwarded          "for=$forwarded_for;proto=$scheme;host=\"$http_host\"";

# Fremde Forwarding-/Trace-Header entfernen
proxy_set_header X-Forwarded-Prefix        "";
proxy_set_header X-Original-Forwarded-For  "";
proxy_set_header X-Real-IP                 "";
proxy_set_header X-Original-URL            "";
proxy_set_header X-Original-Method         "";
proxy_set_header X-Forwarded-Access-Token  "";
proxy_set_header traceparent               "";
proxy_set_header tracestate                "";

# Security-Header vom Upstream verwerfen, die der Proxy selbst setzt (http-Ebene,
# snippets/security-headers.conf). Grund: add_header ERGÄNZT, ersetzt nicht — sonst
# doppelte/konfligierende Werte (z. B. Keycloak SAMEORIGIN + Proxy DENY).
# Content-Security-Policy wird bewusst NICHT versteckt: Keycloak braucht die eigene
# (Admin-Console/Login-Theme script-src-Allowlist).
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Sicherheits-Header (HSTS, nosniff, X-Frame-Options, Referrer-Policy,
    # Permissions-Policy) für ALLE Vhosts — genau eine Quelle der Wahrheit.
    # http-Ebene, damit jeder Server-Block sie erbt; Details siehe Datei.
    include /etc/nginx/snippets/security-headers.conf;

    # Keine Query-Strings loggen: enthalten OIDC-Parameter (session_code, state, nonce).
    log_format main '$remote_addr $time_iso8601 "$request_method $uri" '
                    '$status $body_bytes_sent rt=$request_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;

    keepalive_timeout      30s;
    client_header_timeout  10s;
    client_body_timeout    15s;
    send_timeout           30s;

    # TLS 1.2 und 1.3, nur Forward Secrecy mit AEAD-Suiten (keine CBC, kein RSA-Schlüsseltransport)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Zusatzschutz, kein Ersatz für die Brute-Force-Erkennung von Keycloak.
    limit_req_zone $binary_remote_addr zone=kc_requests:10m rate=10r/s;
    limit_req_status 429;

    # RFC 7239: IPv6-Adressen im Forwarded-Header in Klammern und Anführungszeichen.
    map $remote_addr $forwarded_for {
        "~^:"   "\"[$remote_addr]\"";
        default $remote_addr;
    }

    # Feste Adressen der Keycloak-Knoten (siehe docker-compose.yml, ipv4_address).
    upstream keycloak {
        server 172.30.0.4:8080;
        server 172.30.0.3:8080;
        keepalive 32;
    }

    # Unbekannte SNI-Namen: TLS-Handshake abbrechen.
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    # Mandanten-Server (je Host, exakte Realm-Locations).
    include /etc/nginx/generated/tenants.conf;

    # Admin-Host (aus dem Template gerendert, nur MGMT_CIDR).
    include /etc/nginx/conf.d/*.conf;
}
